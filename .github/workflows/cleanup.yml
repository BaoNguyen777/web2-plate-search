name: Cleanup old plate images

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete records older than 24 hours
        env:
          CLEANUP_URL: ${{ secrets.CLEANUP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CLEANUP_URL"
          curl --fail-with-body -X POST "$CLEANUP_URL/api/cleanup" \
            -H "Authorization: Bearer $CRON_SECRET"
